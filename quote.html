<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Quote Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1d2671, #c33764);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #fff;
            width: 420px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: slide 0.8s ease;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        .quote {
            font-size: 18px;
            color: #444;
            margin: 20px 0;
            min-height: 70px;
        }

        .author {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .fact {
            background: #f2f2f2;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            background: #1d2671;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c33764;
            transform: scale(1.05);
        }

        @keyframes slide {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📜 Random Quote</h1>

        <div class="quote" id="quote">
            Click the button to load a quote
        </div>

        <div class="author" id="author"></div>

        <div class="fact" id="fact">
            🤯 Interesting fact will appear here
        </div>

        <button onclick="getQuote()">New Quote</button>
    </div>

    <script>
    const quoteEl = document.getElementById("quote");
    const authorEl = document.getElementById("author");
    const factEl = document.getElementById("fact");

    const facts = [
        "⚡ JavaScript was created in just 10 days.",
        "💻 HTML is not a programming language.",
        "🌍 The first website is still online.",
        "🧠 The brain generates enough electricity to power a light bulb.",
        "🚀 Email existed before the internet."
    ];

    // Local fallback quotes used when the API cannot be reached
    const localQuotes = [
        { content: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
        { content: "Two things are infinite: the universe and human stupidity; and I'm not sure about the universe.", author: "Albert Einstein" },
        { content: "So many books, so little time.", author: "Frank Zappa" },
        { content: "A room without books is like a body without a soul.", author: "Marcus Tullius Cicero" },
        { content: "In three words I can sum up everything I've learned about life: it goes on.", author: "Robert Frost" }
    ];

    async function getQuote() {
        quoteEl.innerText = "⏳ Loading quote...";
        authorEl.innerText = "";

        try {
            const response = await fetch("https://api.quotable.io/random", {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            });

            if (!response.ok) {
                throw new Error("API error");
            }

            const data = await response.json();

            quoteEl.innerText = `"${data.content}"`;
            authorEl.innerText = `— ${data.author}`;

            const randomFact = facts[Math.floor(Math.random() * facts.length)];
            factEl.innerText = randomFact;

        } catch (error) {
            
            const fallback = localQuotes[Math.floor(Math.random() * localQuotes.length)];
            quoteEl.innerText = `"${fallback.content}"`;
            authorEl.innerText = `— ${fallback.author}`;
            const randomFact = facts[Math.floor(Math.random() * facts.length)];
            factEl.innerText = randomFact + " (offline)";
        }
    }

    // Load quote automatically when page opens
    getQuote();
</script>

</body>
</html>
